name: virtual-haibin

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: virtual-haibin-dev:local
  working_dir: /workspace

# Public demo identifiers shared by the mock service (which quotes them) and
# the human-approval boundary (apps/approver, which authorizes them). Not
# secrets.
#   network   -- Virtual Haibin settlement profile name (not a chain id)
#   mint      -- mainnet USDC mint address *as cloned into the Pay.sh Solana
#                Payment Sandbox*; sandbox tokens have no real value
#   recipient -- random placeholder address with no key behind it
x-demo-payment-config: &demo-payment-config
  VH_DEMO_NETWORK: "solana-payment-sandbox"
  VH_DEMO_MINT: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
  VH_DEMO_SERVICE_RECIPIENT: "6hqZufQGmDeGCHtiSNnGT246hdpdBUZTUzgKbonDXSTb"

# Pay.sh Solana Payment Sandbox (hosted Surfpool test validator; no real
# funds). Trusted configuration: only the authority and the mock merchant use
# it; the agent and web never see or choose an RPC.
x-sandbox-rpc: &sandbox-rpc "https://402.surfnet.dev:8899"

x-dev-volumes: &dev-volumes
  - .:/workspace
  - root_node_modules:/workspace/node_modules
  - web_node_modules:/workspace/apps/web/node_modules
  - agent_node_modules:/workspace/apps/agent/node_modules
  - authority_node_modules:/workspace/apps/authority/node_modules
  - service_agent_node_modules:/workspace/apps/service-agent/node_modules
  - identity_node_modules:/workspace/packages/identity/node_modules
  - mandate_node_modules:/workspace/packages/mandate/node_modules
  - policy_node_modules:/workspace/packages/policy/node_modules
  - payments_node_modules:/workspace/packages/payments/node_modules
  - audit_node_modules:/workspace/packages/audit/node_modules
  - approver_node_modules:/workspace/apps/approver/node_modules

services:
  # Human-approval boundary: the ONLY holder of the PurchasePermit issuer
  # private key. The key and the human's approval code live in
  # approver_keys, mounted by no other service; only the issuer PUBLIC key is
  # written to issuer_trust. Every approval must present the approval code
  # (read it with: docker compose exec approver cat /keys/approval-code).
  # Own network + loopback-only port are defense in depth: on Docker Desktop
  # other containers can still reach the port via host.docker.internal.
  approver:
    <<: *app-image
    command: ["pnpm", "dev:approver"]
    environment:
      <<: *demo-payment-config
      APPROVER_PORT: "4003"
      APPROVER_KEY_FILE: "/keys/issuer-ed25519.seed"
      APPROVER_CODE_FILE: "/keys/approval-code"
      APPROVER_TRUST_FILE: "/trust/trusted-issuer"
      APPROVER_ALLOWED_ORIGIN: "http://localhost:5173"
    ports:
      - "127.0.0.1:4003:4003"
    networks:
      - approval
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - approver_node_modules:/workspace/apps/approver/node_modules
      - mandate_node_modules:/workspace/packages/mandate/node_modules
      - approver_keys:/keys
      - issuer_trust:/trust
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  service-agent:
    <<: *app-image
    command: ["pnpm", "dev:service"]
    environment:
      <<: *demo-payment-config
      SERVICE_AGENT_PORT: "4001"
      SANDBOX_RPC_URL: *sandbox-rpc
      # Demo-only fault injection: the address the mock service quotes when
      # asked for the wrong-recipient scenario (semantic DENY, demo Case 3).
      VH_DEMO_WRONG_RECIPIENT: "DS2xXiLQwn48Laj3XYvCMETqUGXsjBUcXRFTP6G3NYVr"
    ports:
      - "4001:4001"
    volumes: *dev-volumes
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  authority:
    <<: *app-image
    command: ["pnpm", "dev:authority"]
    environment:
      AUTHORITY_PORT: "4002"
      # Non-secret audience identifier agents must name in signed requests.
      AUTHORITY_AUDIENCE: "virtual-haibin-authority-dev"
      # Durable budget/invocation state (SQLite) on the authority-only volume below.
      AUTHORITY_DB_PATH: "/data/authority.db"
      # Trusted settlement profile RPC and the only paid URL the authority
      # will ever call (never agent/service supplied).
      SANDBOX_RPC_URL: *sandbox-rpc
      PAID_SERVICE_REPORT_URL: "http://service-agent:4001/api/v1/report"
      # Issuer trust root: the one issuer public key allowed to authorize
      # spending (published by the approver; mounted read-only below).
      AUTHORITY_TRUSTED_ISSUER_FILE: "/trust/trusted-issuer"
      # Dev-only shared bearer token authenticating agent -> authority HTTP
      # calls. Supplied at runtime from the gitignored .env file (see
      # .env.example); never commit a value here.
      AUTHORITY_SHARED_SECRET: ${AUTHORITY_SHARED_SECRET:?AUTHORITY_SHARED_SECRET is required}
    ports:
      - "4002:4002"
    # Same as *dev-volumes plus the authority-only data volume (YAML cannot
    # merge anchored lists). Only the authority mounts authority_data.
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - agent_node_modules:/workspace/apps/agent/node_modules
      - authority_node_modules:/workspace/apps/authority/node_modules
      - service_agent_node_modules:/workspace/apps/service-agent/node_modules
      - identity_node_modules:/workspace/packages/identity/node_modules
      - mandate_node_modules:/workspace/packages/mandate/node_modules
      - policy_node_modules:/workspace/packages/policy/node_modules
      - payments_node_modules:/workspace/packages/payments/node_modules
      - audit_node_modules:/workspace/packages/audit/node_modules
      - approver_node_modules:/workspace/apps/approver/node_modules
      - authority_data:/data
      - issuer_trust:/trust:ro
    depends_on:
      approver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The autonomous agent: holds only its non-spending identity key. No issuer
  # key, no trust volume, no route to the approver.
  agent:
    <<: *app-image
    command: ["pnpm", "dev:agent"]
    environment:
      AGENT_PORT: "4000"
      AGENT_ALLOWED_ORIGIN: "http://localhost:5173"
      SERVICE_AGENT_URL: "http://service-agent:4001"
      AUTHORITY_URL: "http://authority:4002"
      AUTHORITY_AUDIENCE: "virtual-haibin-authority-dev"
      AUTHORITY_SHARED_SECRET: ${AUTHORITY_SHARED_SECRET:?AUTHORITY_SHARED_SECRET is required}
    ports:
      - "4000:4000"
    volumes: *dev-volumes
    depends_on:
      service-agent:
        condition: service_healthy
      authority:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Stands in for the human's browser/terminal in scripted demos and the
  # sandbox integration test: it can reach the approver (approval network)
  # and the agent/authority (default network). Only started on demand:
  #   docker compose run --rm demo-driver node scripts/semantic-demo.mjs
  demo-driver:
    <<: *app-image
    profiles: ["tools"]
    command: ["node", "scripts/semantic-demo.mjs"]
    environment:
      AGENT_URL: "http://agent:4000"
      APPROVER_URL: "http://approver:4003"
      AUTHORITY_URL: "http://authority:4002"
      SERVICE_URL: "http://service-agent:4001"
      # Supplied by the operator per run, never stored in the repo:
      #   docker compose run --rm -e APPROVER_CODE="$(docker compose exec -T approver cat /keys/approval-code)" demo-driver ...
      APPROVER_CODE: ${APPROVER_CODE:-}
      AUTHORITY_SHARED_SECRET: ${AUTHORITY_SHARED_SECRET:?AUTHORITY_SHARED_SECRET is required}
    networks:
      - default
      - approval
    volumes:
      - .:/workspace

  web:
    <<: *app-image
    command: ["pnpm", "dev:web"]
    environment:
      VITE_AGENT_API_URL: "http://localhost:4000"
      VITE_APPROVER_API_URL: "http://localhost:4003"
    ports:
      - "5173:5173"
    volumes: *dev-volumes
    depends_on:
      agent:
        condition: service_healthy

volumes:
  root_node_modules:
  web_node_modules:
  agent_node_modules:
  authority_node_modules:
  service_agent_node_modules:
  identity_node_modules:
  mandate_node_modules:
  policy_node_modules:
  payments_node_modules:
  audit_node_modules:
  approver_node_modules:
  authority_data:
  # Issuer private key (approver only) and the published issuer public key.
  approver_keys:
  issuer_trust:

networks:
  default:
  # The approver alone. Nothing else joins it except the demo-driver tool.
  approval:
