name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build
        run: pnpm check

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start development stack
        run: docker compose up -d --build --wait

      - name: Smoke test services
        run: |
          curl --fail --silent --show-error http://localhost:5173/ > /dev/null
          curl --fail --silent --show-error http://localhost:4000/health > /dev/null
          curl --fail --silent --show-error http://localhost:4001/health > /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop development stack
        if: always()
        run: docker compose down -v
